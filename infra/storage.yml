Resources:
  TelemetryBucket:
    Type: AWS::S3::Bucket
    Condition: CreateTelemetryBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Join:
          - '-'
          - [af, '${sls:stage}', {Ref: 'AWS::AccountId'}, {Ref: 'AWS::Region'}, telemetry-lake]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  TelemetryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateTelemetryBucket
    Properties:
      Bucket:
        Ref: TelemetryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt: [TelemetryBucket, Arn]
              - Fn::Join: ['', [{Fn::GetAtt: [TelemetryBucket, Arn]}, '/*']]
            Condition:
              Bool:
                aws:SecureTransport: 'false'
