  TelemetryDlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsAvailable
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::If:
              - CreateQueues
              - Fn::GetAtt: [TelemetryDlq, QueueName]
              - Fn::Select: [5, {Fn::Split: [':', {Ref: ExistingTelemetryDlqArn}]}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  TelemetryQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsAvailable
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::If:
              - CreateQueues
              - Fn::GetAtt: [TelemetryQueue, QueueName]
              - Fn::Select: [5, {Fn::Split: [':', {Ref: ExistingTelemetryQueueArn}]}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
