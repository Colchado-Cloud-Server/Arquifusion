Resources:
  FirebaseAuthorizerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsAvailable
    Properties:
      AlarmName: af-${sls:stage}-firebase-authorizer-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: af-${sls:stage}-firebase-authorizer
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
